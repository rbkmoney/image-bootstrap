CFLAGS="-march=corei7-avx -mtune=corei7-avx -O2 -pipe -mfpmath=sse -mno-fma -mno-fma4 -mno-avx2 -mno-xop"
CXXFLAGS="${CFLAGS}"
CHOST="x86_64-pc-linux-gnu"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
MAKEOPTS="-j8"
FEATURES="xattr sandbox userfetch parallel-fetch parallel-install clean-logs compress-build-logs unmerge-logs splitdebug compressdebug fail-clean unmerge-orphans getbinpkg -news nodoc noman noinfo"
EMERGE_DEFAULT_OPTS="--quiet-build --verbose --binpkg-changed-deps=n"
PORT_LOGDIR="/var/log/portage"
GENTOO_MIRRORS="https://gentoo.bakka.su/gentoo-distfiles"
PORTAGE_BINHOST="https://gentoo.bakka.su/gentoo-packages/amd64/corei7-avx/packages"
ACCEPT_KEYWORDS="amd64"
ACCEPT_LICENSE="*"
L10N="en"

CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3 sse4 sse4_1 sse4_2 aes popcnt avx"
CURL_SSL="openssl"
PYTHON_SINGLE_TARGET="python3_10"
PYTHON_TARGETS="python3_10"
USE_SALT="audit caps ecdsa efi filecaps json gnupg http2 iproute2 leaps_timezone logrotate lz4 lzma lzo zstd multitarget netlink nettle nfsv4 nfsv41 numa openssl pcre16 sctp seccomp smp sqlite threads udev xattr xfs -X -bindist -dbus -gnutls -tcpd"
USE="${USE_SALT}"

