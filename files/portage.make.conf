CFLAGS="-march=corei7-avx -mtune=corei7-avx -O2 -pipe -mfpmath=sse -mno-fma -mno-fma4 -mno-avx2 -mno-xop"
CXXFLAGS="${CFLAGS}"
CHOST="x86_64-pc-linux-gnu"
PORTDIR="/usr/portage"
DISTDIR="/var/tmp/distfiles"
PKGDIR="/var/tmp/packages"
MAKEOPTS="-j8"
FEATURES="sandbox userfetch parallel-fetch parallel-install clean-logs compress-build-logs splitdebug compressdebug fail-clean unmerge-orphans getbinpkg -news nodoc noinfo noman"
EMERGE_DEFAULT_OPTS="--quiet-build --verbose --keep-going --binpkg-changed-deps=n"
PORT_LOGDIR="/var/log/portage"
GENTOO_MIRRORS="https://gentoo.rbkmoney.com/gentoo-distfiles"
PORTAGE_BINHOST="https://pkgs.rbk.money/gentoo-packages/amd64/sandybridge/packages"
ACCEPT_KEYWORDS="amd64"
L10N="en"

CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3 sse4 sse4_1 sse4_2 aes avx"
USE_SALT="smp multitarget numa caps seccomp xattr sctp lzma logrotate sqlite -gnutls -tcpd -doc -examples"
USE_SALT="argon2 audit caps cgroups cracklib ecdsa efi filecaps json gnupg http2 iproute2 leaps_timezone logrotate lz4 lzma lzo multitarget netlink nettle nfsv4 nfsv41 numa openssl pcre16 sctp seccomp smp sqlite threads udev xattr xfs -X -bindist -dbus -gnutls -tcpd"
USE="${USE_SALT}"
PYTHON_TARGETS="python3_7"
PYTHON_SINGLE_TARGET="python3_7"
